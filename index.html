<!doctype html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="veiwport"content="width=device-width,initial-scale=1.0">
    <title>RESULT PORTAL</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="portal-container">
            <div class="portal-card">
                <div class="portal-header">
                    <div class="logo"><img src="images/images.jfif"alt="University Logo"></div>
                    <h2>UNIVERSITY OF CALABAR</h2>
                    <p>RESULT PORTAL</p>
                </div>
                <form id="studentForm">
                    <label for="matric">MATRICULATION NUMBER</label>
                    <input type="text" id="matric" placeholder="e.g. cc/20/0001">
                    <label for="jamb">JAMB REGISTRATION NUMBER</label>
                        <input type="text" id="jamb" placeholder="e.g.12345678AB">
                        <label for="pin">ACCESS PIN</label>
                        <input type="text" id="pin" placeholder="Enter your pin">
                        <div class="student-buttons"> 
                            <button type="button">NEW STUDENT</button>
                            <button type="button">RETURNING STUDENT</button> 

                        </div>
                        <button type="submit" class="login-btn">LOGIN</button>
                </form>
                <div>

                <div class="portal-footer">
                <a href="#">Don't have a pin? get one here</a>
                <a href="#">Change pin</a>
                </div>
            </div>
        </div>
    </body>
</html>
